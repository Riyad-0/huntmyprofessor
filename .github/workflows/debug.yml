name: Debug

on:
  workflow_dispatch:
    inputs:
      cookieValue:
        description: 'Cookie value'
        required: true
      courseSearchPage:
        description: 'Course search page'
        required: true

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      # TODO: needed?
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Scrape
        run: |
          python gh-main.py
        env:
          COOKIE_VALUE: ${{ inputs.cookieValue }}
          COURSE_SEARCH_PAGE: ${{ inputs.courseSearchPage }}
          MODE: 'debug'
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifact
          path: |
            data/evals.txt
            data/schema.json
            data/evals.json
            logs/hunt.log
          retention-days: 5